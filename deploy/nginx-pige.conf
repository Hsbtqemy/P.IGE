# /etc/nginx/sites-available/pige  (replace pige.example.org by the chosen subdomain)
#
# Install in two steps (see deploy/README.md, step 7): nginx refuses a 443 block
# without a certificate, so first enable only the port-80 block, obtain the
# certificate, then enable the 443 block with the two ssl_certificate lines.

server {
    listen 80;
    listen [::]:80;
    server_name pige.example.org;

    # Used by certbot to prove the domain (step 7a).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.25.1 or later: keep "http2 on;". Older nginx (Debian 12, Ubuntu 24.04):
    # delete it and write "listen 443 ssl http2;" instead.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pige.example.org;

    ssl_certificate /etc/letsencrypt/live/pige.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pige.example.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 1m;

    # Login attempts are also throttled by the application; this caps raw request rates.
    location = /api/login {
        limit_req zone=pige_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/snippets/pige-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/snippets/pige-proxy.conf;
    }
}

