# /etc/nginx/sites-available/pige  (replace pige.example.org by the chosen subdomain)
# The certificate lines are added by: certbot --nginx -d pige.example.org

server {
    listen 80;
    listen [::]:80;
    server_name pige.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pige.example.org;

    # ssl_certificate / ssl_certificate_key: managed by certbot

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 1m;

    # Login attempts are also throttled by the application; this caps raw request rates.
    location = /api/login {
        limit_req zone=pige_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/snippets/pige-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/snippets/pige-proxy.conf;
    }
}

# --- /etc/nginx/conf.d/pige-ratelimit.conf ---------------------------------
