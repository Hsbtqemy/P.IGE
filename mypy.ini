# mypy configuration for P.IGE.
# Scope is intentionally limited to the server and utils packages for now;
# extend `files` as other packages get typed.
[mypy]
python_version = 3.11
files = pige/server, pige/utils
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_optional = True
strict_equality = True
show_error_codes = True

# Out of scope for now: modules reached only through imports are analysed
# for types but their own errors are not reported. Remove when typing them.
[mypy-pige.core.*]
follow_imports = silent

# Third-party packages without stubs: fastapi, uvicorn, pydantic and icalendar
# ship their own type information (installed via `.[server,dev]`), so no
# ignore_missing_imports section is needed. Add one per package if that changes.
