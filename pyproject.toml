[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pige"
version = "0.1.1"
description = "Programme de journaling PIGE"
requires-python = ">=3.11"
dependencies = [
    "icalendar>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pige*"]