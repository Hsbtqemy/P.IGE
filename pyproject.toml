[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pige"
version = "0.2.0"
description = "Programme de journaling PIGE"
requires-python = ">=3.11"
dependencies = [
    "icalendar>=5.0.0",
    "platformdirs>=4",
]

[project.optional-dependencies]
# HTTP server for the web interface and the Thunderbird extension.
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "webauthn>=3.0.1,<4",
    "recurring-ical-events>=3.8.2,<4",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pige*"]