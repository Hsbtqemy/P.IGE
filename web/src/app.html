<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="P.IGE" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon-192.png" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<title>P.IGE</title>
		<script>
			// The theme chosen in Réglages (lib/theme.ts), applied before the first paint.
			try {
				var t = localStorage.getItem('pige-theme');
				if (t === 'light' || t === 'dark') {
					document.documentElement.dataset.theme = t;
					document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
						m.content = t === 'dark' ? '#14181d' : '#eef1f4';
					});
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
