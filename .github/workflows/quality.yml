name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[server,dev]"

      - name: Syntax check
        run: python -m compileall pige tests

      - name: Unit tests (unittest suite)
        run: python -m unittest discover tests

      - name: Unit tests (pytest suite)
        run: |
          pytest -q \
            tests/test_indexing.py \
            tests/test_search.py \
            tests/test_storage.py \
            tests/test_service.py \
            tests/test_cli.py \
            tests/test_hierarchy.py \
            tests/test_service_hierarchy.py \
            tests/test_pagination.py \
            tests/test_tree_diff.py \
            tests/test_service_tasks_sync.py \
            tests/test_server.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
