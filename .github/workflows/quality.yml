name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[server,dev]"

      - name: Syntax check
        run: python -m compileall pige tests

      # Linters are pinned here (not in pyproject.toml) so that upgrades are
      # explicit. Config: ruff.toml, mypy.ini.
      - name: Install linters
        run: pip install "ruff==0.17.1" "mypy==2.4.0"

      - name: Lint (ruff)
        run: ruff check pige tests --output-format github

      - name: Type check (mypy)
        run: python -m mypy

      - name: Unit tests (unittest suite)
        run: python -m unittest discover tests

      - name: Unit tests (pytest suite)
        run: |
          pytest -q \
            tests/test_indexing.py \
            tests/test_search.py \
            tests/test_storage.py \
            tests/test_service.py \
            tests/test_cli.py \
            tests/test_hierarchy.py \
            tests/test_service_hierarchy.py \
            tests/test_pagination.py \
            tests/test_tree_diff.py \
            tests/test_service_tasks_sync.py \
            tests/test_server.py \
            tests/test_server_v2.py \
            tests/test_server_security.py \
            tests/test_model.py \
            tests/test_import_legacy.py

      - name: Thunderbird extension (helpers)
        run: node --test thunderbird/test/lib.test.mjs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
